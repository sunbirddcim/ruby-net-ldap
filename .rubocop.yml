inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  AllowSymlinksInCacheRootDirectory: true
  Exclude:
    - 'pkg/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'db/schema.rb'
    - 'tmp/**/*'
    - 'bin/**/*'

Layout/ExtraSpacing:
  Enabled: false

Lint/AssignmentInCondition:
  Enabled: false

Style/ParallelAssignment:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

# New cops (NewCops: enable) are not applied to files that exist upstream, so
# that pulling in upstream changes does not produce style-only merge conflicts.
Gemspec/DeprecatedAttributeAssignment:
  Exclude:
    - 'net-ldap.gemspec'
Gemspec/RequireMFA:
  Exclude:
    - 'net-ldap.gemspec'
Layout/LineEndStringConcatenationIndentation:
  Exclude:
    - 'test/test_filter.rb'
Lint/AmbiguousOperatorPrecedence:
  Exclude:
    - 'lib/net/ber/core_ext/array.rb'
    - 'lib/net/ber/core_ext/integer.rb'
    - 'test/ber/test_ber.rb'
Lint/DuplicateBranch:
  Exclude:
    - 'lib/net/ber/core_ext/string.rb'
    - 'lib/net/ldap/pdu.rb'
Lint/IncompatibleIoSelectWithFiberScheduler:
  Exclude:
    - 'lib/net/ldap/connection.rb'
Naming/BlockForwarding:
  Exclude:
    - 'lib/net/ldap/dataset.rb'
    - 'lib/net/ldap/dn.rb'
    - 'lib/net/ldap/entry.rb'
    - 'lib/net/ldap/filter.rb'
Naming/PredicateMethod:
  Exclude:
    - 'lib/net/ldap.rb'
Style/ArgumentsForwarding:
  Exclude:
    - 'lib/net/ldap/dn.rb'
    - 'lib/net/ldap/filter.rb'
Style/BitwisePredicate:
  Exclude:
    - 'lib/net/ber/ber_parser.rb'
    - 'lib/net/ber/core_ext/integer.rb'
Style/FileRead:
  Exclude:
    - 'test/test_ldif.rb'
Style/OneClassPerFile:
  Exclude:
    - 'test/**/*'
    - 'lib/net/ber.rb'
    - 'lib/net/ber/core_ext.rb'
    - 'lib/net/ldap.rb'
    - 'lib/net/ldap/pdu.rb'
Style/OpenStructUse:
  Exclude:
    - 'lib/net/ldap.rb'
    - 'lib/net/ldap/connection.rb'
    - 'lib/net/ldap/pdu.rb'
    - 'test/test_search.rb'
Style/RedundantConstantBase:
  Exclude:
    - 'lib/net/ber/core_ext.rb'
Style/RedundantRegexpArgument:
  Exclude:
    - 'lib/net/ber.rb'
